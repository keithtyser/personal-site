<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 770" role="img" aria-labelledby="title desc">
  <title id="title">The accuracy of behavioral cloning increased, but the model did not beat a strong bot</title>
  <desc id="desc">Exact-action behavioral cloning, epochs 1 to 11. The worker-command accuracy on 650 held-out games increased from 76.2 percent at epoch 1 to 85.7 percent at epoch 11. At each epoch, the model won 0 of 24 games against three strong bots.</desc>
  <defs>
    <style>
      .sans { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", Consolas, monospace; }
      .title { fill:#f1f4ef; font-size:42px; font-weight:700; }
      .sub { fill:#a4ada4; font-size:24px; }
      .axis { fill:#aeb8ae; font-size:22px; }
      .small { fill:#9fa99f; font-size:20px; }
      .label { fill:#e7ece7; font-size:25px; font-weight:650; }
      .line { stroke:#91e575; stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .raw { stroke:#91e575; stroke-opacity:0.28; stroke-width:1.5; fill:none; stroke-linejoin:round; }
      .dot { fill:#91e575; stroke:#0d100e; stroke-width:2; }
      .grid { stroke:#344037; stroke-width:1; }
      .ref { stroke:#8a968b; stroke-width:2; stroke-dasharray:7 7; }
      .cell { fill:#1a201b; stroke:#39433b; stroke-width:1; }
      .zero { fill:#e7ece7; font-size:21px; font-weight:650; }
    </style>
  </defs>
  <rect x="1" y="1" width="598" height="768" fill="#0d100e" stroke="#39433b"/>
  <text x="36.0" y="66.0" class="sans title">Accuracy increased.</text>
  <text x="36.0" y="110.0" class="sans title">Wins stayed at zero.</text>
  <text x="36.0" y="150.0" class="sans sub">Exact-action BC, epochs 1-11</text>
  <text x="84.0" y="188.0" class="mono small">WORKER-COMMAND ACCURACY (HELD OUT)</text>
  <line x1="96" y1="510.0" x2="560" y2="510.0" class="grid"/>
  <text x="82.0" y="517.5" text-anchor="end" class="mono axis">70%</text>
  <line x1="96" y1="435.0" x2="560" y2="435.0" class="grid"/>
  <text x="82.0" y="442.5" text-anchor="end" class="mono axis">75%</text>
  <line x1="96" y1="360.0" x2="560" y2="360.0" class="grid"/>
  <text x="82.0" y="367.5" text-anchor="end" class="mono axis">80%</text>
  <line x1="96" y1="285.0" x2="560" y2="285.0" class="grid"/>
  <text x="82.0" y="292.5" text-anchor="end" class="mono axis">85%</text>
  <line x1="96" y1="210.0" x2="560" y2="210.0" class="grid"/>
  <text x="82.0" y="217.5" text-anchor="end" class="mono axis">90%</text>
  <path d="M117.1,417.4 L243.6,314.5 L370.2,285.5 L496.7,280.7 L538.9,275.2" class="line"/>
  <circle cx="117.1" cy="417.4" r="7.5" class="dot"/>
  <circle cx="243.6" cy="314.5" r="7.5" class="dot"/>
  <circle cx="370.2" cy="285.5" r="7.5" class="dot"/>
  <circle cx="496.7" cy="280.7" r="7.5" class="dot"/>
  <circle cx="538.9" cy="275.2" r="7.5" class="dot"/>
  <text x="134.6" y="424.9" class="sans label">76.2%</text>
  <text x="538.9" y="252.7" text-anchor="end" class="sans label">85.7%</text>
  <text x="84.0" y="579.5" class="mono small">WINS VS. 3 STRONG BOTS (OF 24)</text>

  <text x="285.8" y="638.2" text-anchor="middle" class="mono zero">0</text>
  <text x="285.8" y="689.5" text-anchor="middle" class="mono axis">5</text>
  <rect x="309.9" y="602.0" width="36.2" height="55.0" rx="4" class="cell"/>
  <text x="328.0" y="638.2" text-anchor="middle" class="mono zero">0</text>
  <text x="328.0" y="689.5" text-anchor="middle" class="mono axis">6</text>
  <rect x="352.1" y="602.0" width="36.2" height="55.0" rx="4" class="cell"/>
  <text x="370.2" y="638.2" text-anchor="middle" class="mono zero">0</text>
  <text x="370.2" y="689.5" text-anchor="middle" class="mono axis">7</text>
  <rect x="394.3" y="602.0" width="36.2" height="55.0" rx="4" class="cell"/>
  <text x="412.4" y="638.2" text-anchor="middle" class="mono zero">0</text>
  <text x="412.4" y="689.5" text-anchor="middle" class="mono axis">8</text>
  <rect x="436.5" y="602.0" width="36.2" height="55.0" rx="4" class="cell"/>
  <text x="454.5" y="638.2" text-anchor="middle" class="mono zero">0</text>
  <text x="454.5" y="689.5" text-anchor="middle" class="mono axis">9</text>
  <rect x="478.6" y="602.0" width="36.2" height="55.0" rx="4" class="cell"/>
  <text x="496.7" y="638.2" text-anchor="middle" class="mono zero">0</text>
  <text x="496.7" y="689.5" text-anchor="middle" class="mono axis">10</text>
  <rect x="520.8" y="602.0" width="36.2" height="55.0" rx="4" class="cell"/>
  <text x="538.9" y="638.2" text-anchor="middle" class="mono zero">0</text>
  <text x="538.9" y="689.5" text-anchor="middle" class="mono axis">11</text>
  <text x="328.0" y="727.0" text-anchor="middle" class="mono small">BC EPOCH</text>

  <text x="159.3" y="638.2" text-anchor="middle" class="mono zero">0</text>
  <text x="159.3" y="689.5" text-anchor="middle" class="mono axis">2</text>
  <rect x="183.4" y="602.0" width="36.2" height="55.0" rx="4" class="cell"/>
  <text x="201.5" y="638.2" text-anchor="middle" class="mono zero">0</text>
  <text x="201.5" y="689.5" text-anchor="middle" class="mono axis">3</text>

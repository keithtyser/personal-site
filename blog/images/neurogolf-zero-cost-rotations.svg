<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Two zero-cost rotations</title>
  <desc id="desc">ARC examples for Task087 and Task140. Each output is the input grid rotated 180 degrees.</desc>
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090c0a"/>
      <stop offset="1" stop-color="#101712"/>
    </linearGradient>
    <style>
      .sans { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", Consolas, monospace; }
      .eyebrow { font-size: 17px; font-weight: 600; letter-spacing: 2.6px; fill: #7ce38b; }
      .title { font-size: 34px; font-weight: 700; fill: #edf4ee; }
      .label { font-size: 15px; font-weight: 600; letter-spacing: 1.4px; fill: #9aa69c; }
      .task { font-size: 23px; font-weight: 700; fill: #edf4ee; }
      .arc-id { font-size: 14px; fill: #879289; }
      .arrow { font-size: 43px; font-weight: 400; fill: #7ce38b; }
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="428" rx="20" fill="url(#bg)" stroke="#2a342c" stroke-width="2"/>
  <text x="58" y="48" class="mono eyebrow">ZERO-COST TASKS</text>
  <text x="58" y="91" class="sans title">Rotate the grid 180°</text>
  
  <text x="58" y="132" class="sans task">Task087</text>
  <text x="58" y="156" class="mono arc-id">3c9b0459</text>
  <text x="58" y="180" class="mono label">INPUT</text>
  <g shape-rendering="crispEdges"><rect x="58" y="194" width="48" height="48" fill="#870C25" stroke="#273129" stroke-width="1"/><rect x="106" y="194" width="48" height="48" fill="#FF4136" stroke="#273129" stroke-width="1"/><rect x="154" y="194" width="48" height="48" fill="#FFDC00" stroke="#273129" stroke-width="1"/><rect x="58" y="242" width="48" height="48" fill="#FF4136" stroke="#273129" stroke-width="1"/><rect x="106" y="242" width="48" height="48" fill="#FFDC00" stroke="#273129" stroke-width="1"/><rect x="154" y="242" width="48" height="48" fill="#FFDC00" stroke="#273129" stroke-width="1"/><rect x="58" y="290" width="48" height="48" fill="#FF4136" stroke="#273129" stroke-width="1"/><rect x="106" y="290" width="48" height="48" fill="#870C25" stroke="#273129" stroke-width="1"/><rect x="154" y="290" width="48" height="48" fill="#FF4136" stroke="#273129" stroke-width="1"/></g>
  <text x="252" y="282" class="sans arrow" text-anchor="middle">→</text>
  <text x="300" y="180" class="mono label">OUTPUT</text>
  <g shape-rendering="crispEdges"><rect x="300" y="194" width="48" height="48" fill="#FF4136" stroke="#273129" stroke-width="1"/><rect x="348" y="194" width="48" height="48" fill="#870C25" stroke="#273129" stroke-width="1"/><rect x="396" y="194" width="48" height="48" fill="#FF4136" stroke="#273129" stroke-width="1"/><rect x="300" y="242" width="48" height="48" fill="#FFDC00" stroke="#273129" stroke-width="1"/><rect x="348" y="242" width="48" height="48" fill="#FFDC00" stroke="#273129" stroke-width="1"/><rect x="396" y="242" width="48" height="48" fill="#FF4136" stroke="#273129" stroke-width="1"/><rect x="300" y="290" width="48" height="48" fill="#FFDC00" stroke="#273129" stroke-width="1"/><rect x="348" y="290" width="48" height="48" fill="#FF4136" stroke="#273129" stroke-width="1"/><rect x="396" y="290" width="48" height="48" fill="#870C25" stroke="#273129" stroke-width="1"/></g>
  
  <text x="660" y="132" class="sans task">Task140</text>
  <text x="660" y="156" class="mono arc-id">6150a2bd</text>
  <text x="660" y="180" class="mono label">INPUT</text>
  <g shape-rendering="crispEdges"><rect x="660" y="194" width="48" height="48" fill="#AAAAAA" stroke="#273129" stroke-width="1"/><rect x="708" y="194" width="48" height="48" fill="#AAAAAA" stroke="#273129" stroke-width="1"/><rect x="756" y="194" width="48" height="48" fill="#FF4136" stroke="#273129" stroke-width="1"/><rect x="660" y="242" width="48" height="48" fill="#0074D9" stroke="#273129" stroke-width="1"/><rect x="708" y="242" width="48" height="48" fill="#000000" stroke="#273129" stroke-width="1"/><rect x="756" y="242" width="48" height="48" fill="#000000" stroke="#273129" stroke-width="1"/><rect x="660" y="290" width="48" height="48" fill="#000000" stroke="#273129" stroke-width="1"/><rect x="708" y="290" width="48" height="48" fill="#000000" stroke="#273129" stroke-width="1"/><rect x="756" y="290" width="48" height="48" fill="#000000" stroke="#273129" stroke-width="1"/></g>
  <text x="854" y="282" class="sans arrow" text-anchor="middle">→</text>
  <text x="902" y="180" class="mono label">OUTPUT</text>
  <g shape-rendering="crispEdges"><rect x="902" y="194" width="48" height="48" fill="#000000" stroke="#273129" stroke-width="1"/><rect x="950" y="194" width="48" height="48" fill="#000000" stroke="#273129" stroke-width="1"/><rect x="998" y="194" width="48" height="48" fill="#000000" stroke="#273129" stroke-width="1"/><rect x="902" y="242" width="48" height="48" fill="#000000" stroke="#273129" stroke-width="1"/><rect x="950" y="242" width="48" height="48" fill="#000000" stroke="#273129" stroke-width="1"/><rect x="998" y="242" width="48" height="48" fill="#0074D9" stroke="#273129" stroke-width="1"/><rect x="902" y="290" width="48" height="48" fill="#FF4136" stroke="#273129" stroke-width="1"/><rect x="950" y="290" width="48" height="48" fill="#AAAAAA" stroke="#273129" stroke-width="1"/><rect x="998" y="290" width="48" height="48" fill="#AAAAAA" stroke="#273129" stroke-width="1"/></g>
</svg>

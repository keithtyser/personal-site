<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc">
  <title id="title">The accuracy of behavioral cloning increased, but the model did not beat a strong bot</title>
  <desc id="desc">Exact-action behavioral cloning, epochs 1 to 11. The worker-command accuracy on 650 held-out games increased from 76.2 percent at epoch 1 to 85.7 percent at epoch 11. At each epoch, the model won 0 of 24 games against three strong bots.</desc>
  <defs>
    <style>
      .sans { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", Consolas, monospace; }
      .title { fill:#f1f4ef; font-size:34px; font-weight:700; }
      .sub { fill:#a4ada4; font-size:19px; }
      .axis { fill:#aeb8ae; font-size:18px; }
      .small { fill:#9fa99f; font-size:16px; }
      .label { fill:#e7ece7; font-size:20px; font-weight:650; }
      .line { stroke:#91e575; stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .raw { stroke:#91e575; stroke-opacity:0.28; stroke-width:1.5; fill:none; stroke-linejoin:round; }
      .dot { fill:#91e575; stroke:#0d100e; stroke-width:2; }
      .grid { stroke:#344037; stroke-width:1; }
      .ref { stroke:#8a968b; stroke-width:2; stroke-dasharray:7 7; }
      .cell { fill:#1a201b; stroke:#39433b; stroke-width:1; }
      .zero { fill:#e7ece7; font-size:17px; font-weight:650; }
    </style>
  </defs>
  <rect x="1" y="1" width="998" height="588" fill="#0d100e" stroke="#39433b"/>
  <text x="56.0" y="62.0" class="sans title">Accuracy increased. Wins stayed at zero.</text>
  <text x="56.0" y="91.0" class="sans sub">Exact-action BC, epochs 1-11. Accuracy on 650 held-out games. Wins against three strong bots.</text>
  <text x="96.0" y="138.0" class="mono small">WORKER-COMMAND ACCURACY (HELD OUT)</text>
  <line x1="108" y1="390.0" x2="940" y2="390.0" class="grid"/>
  <text x="94.0" y="396.0" text-anchor="end" class="mono axis">70%</text>
  <line x1="108" y1="332.5" x2="940" y2="332.5" class="grid"/>
  <text x="94.0" y="338.5" text-anchor="end" class="mono axis">75%</text>
  <line x1="108" y1="275.0" x2="940" y2="275.0" class="grid"/>
  <text x="94.0" y="281.0" text-anchor="end" class="mono axis">80%</text>
  <line x1="108" y1="217.5" x2="940" y2="217.5" class="grid"/>
  <text x="94.0" y="223.5" text-anchor="end" class="mono axis">85%</text>
  <line x1="108" y1="160.0" x2="940" y2="160.0" class="grid"/>
  <text x="94.0" y="166.0" text-anchor="end" class="mono axis">90%</text>
  <path d="M145.8,319.0 L372.7,240.2 L599.6,217.8 L826.5,214.2 L902.2,210.0" class="line"/>
  <circle cx="145.8" cy="319.0" r="6.0" class="dot"/>
  <circle cx="372.7" cy="240.2" r="6.0" class="dot"/>
  <circle cx="599.6" cy="217.8" r="6.0" class="dot"/>
  <circle cx="826.5" cy="214.2" r="6.0" class="dot"/>
  <circle cx="902.2" cy="210.0" r="6.0" class="dot"/>

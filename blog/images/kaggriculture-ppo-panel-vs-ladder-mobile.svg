<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 960" role="img" aria-labelledby="title desc">
  <title id="title">The internal panel score increased steadily, but the Kaggle ladder score did not</title>
  <desc id="desc">Final Kaggriculture PPO lineage, September 19 to 30. Top: the score on a fixed panel of eight bots, with 128 games for each evaluation. The score increased from approximately 20 percent at update 119 to 98 percent at update 3529. The evaluator changed at update 2149. Bottom: the Kaggle ladder scores of eleven pure-PPO submissions on October 3. The scores are between 1,605 and 2,399. They decreased while the panel score increased, then increased unevenly. The last score is 2,040. The silver cutoff was 2,048.</desc>
